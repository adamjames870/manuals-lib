[project]
name = "manuals-lib"
version = "0.1.0"
description = "Document ingestion library for technical manuals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.27.2.3",
    "rich>=15.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
